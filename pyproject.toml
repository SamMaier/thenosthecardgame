[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thenos"
version = "0.1.0"
description = "Headless simulator for The Nos card game"
requires-python = ">=3.11"

[project.scripts]
thenos-sim = "thenos.__main__:main"

[tool.setuptools.packages.find]
include = ["thenos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

